<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등 영어 내신 서술형 & 내용이해 트레이너</title>
  <link rel="stylesheet" href="style.css">

  <!-- ES 모듈 맵 설정 -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 고등 영어 내신 서술형 & 내용이해 트레이너</h1>
      <p class="subtitle">모바일 최적화 · 미래엔 교과서 & 모의고사 지문 저장고 · 서술형 대비</p>
    </header>

    <!-- 0단계: API 키 설정 -->
    <section class="card" id="step-api">
      <h2>0단계: Gemini API 키 설정</h2>
      <p class="desc">Google AI Studio API 키를 입력해주세요. (자동 저장됩니다)</p>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy... 로 시작하는 API 키 입력">
        <button id="saveApiKeyBtn" class="btn secondary">저장</button>
      </div>
      <div id="apiKeyStatus" class="status-msg"></div>
    </section>

    <!-- 1단계: 지문 선택 또는 입력 -->
    <section class="card" id="step-input">
      <h2>1단계: 시험 범위 지정 (지문 저장고)</h2>
      <p class="desc">등록된 교과서 본문이나 모의고사 지문을 선택하거나 직접 입력하세요.</p>
      
      <!-- 저장된 지문 선택 드롭다운 (29~34, 36~39번 전체 원본 완벽 탑재) -->
      <div class="option-group">
        <label>📖 저장된 지문 바로 선택하기:</label>
        <select id="presetPassageSelect">
          <option value="">-- 2025년 9월 고1 모의고사 지문 전체 선택 --</option>
          <option value="miraen_art">미래엔 공통영어2: From Shadows to Spotlights</option>
          <option value="mock_29">29번: 초식동물과 사육 (Herbivore species)</option>
          <option value="mock_30">30번: 공유와 생존 (Sharing and resources)</option>
          <option value="mock_31
