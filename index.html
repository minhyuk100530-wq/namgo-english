<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등 영어 내신 서술형 & 내용이해 트레이너</title>
  <link rel="stylesheet" href="style.css">

  <!-- ES 모듈 맵 설정 -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 고등 영어 내신 서술형 & 내용이해 트레이너</h1>
      <p class="subtitle">모바일 최적화 · 미래엔 교과서 & 모의고사 지문 저장고 · 서술형 대비</p>
    </header>

    <!-- 0단계: API 키 설정 -->
    <section class="card" id="step-api">
      <h2>0단계: Gemini API 키 설정</h2>
      <p class="desc">Google AI Studio API 키를 입력해주세요. (자동 저장됩니다)</p>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy... 로 시작하는 API 키 입력">
        <button id="saveApiKeyBtn" class="btn secondary">저장</button>
      </div>
      <div id="apiKeyStatus" class="status-msg"></div>
    </section>

    <!-- 1단계: 지문 선택 또는 입력 -->
    <section class="card" id="step-input">
      <h2>1단계: 시험 범위 지정 (지문 저장고)</h2>
      <p class="desc">등록된 교과서 본문이나 모의고사 지문을 선택하거나 직접 입력하세요.</p>
      
      <!-- 저장된 지문 선택 드롭다운 -->
      <div class="option-group">
        <label>📖 저장된 지문 바로 선택하기:</label>
        <select id="presetPassageSelect">
          <option value="">-- 지문 선택하기 --</option>
          <option value="miraen_art">미래엔 공통영어2: From Shadows to Spotlights (Bill Traylor, Maud Lewis, Anna Ancher)</option>
          <option value="mock_29">고1 모의고사 29번: Herbivore species and captivity</option>
          <option value="mock_30">고1 모의고사 30번: Sharing and resources (Nomadic tribes)</option>
          <option value="mock_31">고1 모의고사 31번: Happiness baseline and adaptation</option>
          <option value="mock_32">고1 모의고사 32번: Adenosine and sleep debt</option>
          <option value="mock_36">고1 모의고사 36번: Desert tortoise and bladder</option>
          <option value="mock_38">고1 모의고사 38번: Nonlinear editing systems</option>
          <option value="mock_39">고1 모의고사 39번: Moral responsibility and intentions</option>
        </select>
      </div>

      <div class="input-field-group" style="margin-top: 12px;">
        <label>선택되거나 직접 입력된 지문 원문:</label>
        <textarea id="passageInput" placeholder="위에서 지문을 선택하면 원문이 여기에 자동으로 채워집니다..."></textarea>
      </div>
      
      <div class="option-group">
        <label>문제 출제 유형:</label>
        <select id="quizTypeSelect">
          <option value="mixed">전체 혼합 (내용이해 + 어법/어휘 + 서술형 영작)</option>
          <option value="comprehension">내용 이해 & Q&A 질문 전용</option>
          <option value="subjective">서술형 / 조건부 영작 전용</option>
        </select>
      </div>

      <button id="generateBtn" class="btn primary">🚀 10문제 생성하기</button>
    </section>

    <!-- 로딩 화면 -->
    <section class="card loading-card" id="step-loading" style="display: none;">
      <div class="spinner"></div>
      <p id="loadingText">AI가 지문 내용과 서술형 출제 포인트를 분석하여 10문제를 생성 중입니다...</p>
    </section>

    <!-- 2단계: 퀴즈 풀이 영역 -->
    <section class="card" id="step-quiz" style="display: none;">
      <div class="quiz-header">
        <span id="quizProgress">문제 1 / 10</span>
        <span id="scoreBadge">점수: 0점</span>
      </div>
      
      <div id="questionContainer" class="question-box"></div>

      <div class="quiz-footer">
        <button id="nextBtn" class="btn primary">다음 문제</button>
      </div>
    </section>

    <!-- 3단계: 결과 및 피드백 영역 -->
    <section class="card" id="step-result" style="display: none;">
      <h2>🎉 학습 완료!</h2>
      <div id="scoreSummary" class="score-summary"></div>
      <div id="feedbackContainer" class="feedback-box"></div>
      <button id="restartBtn" class="btn primary">처음으로 돌아가기</button>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
