<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등 영어 내신 & 모의고사 AI 문제 생성기</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary-color); text-align: center; }
    .step-box { margin-bottom: 24px; padding: 20px; border: 1px solid var(--border-color); border-radius: 12px; background: #fff; }
    .step-box h2 { font-size: 1.1rem; margin-bottom: 10px; color: #334155; }
    input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; margin-bottom: 10px; }
    textarea { height: 150px; resize: vertical; }
    .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn:hover { background-color: var(--primary-hover); }
    .btn.secondary { background-color: #64748b; }
    .btn.secondary:hover { background-color: #475569; }
    #step-loading { display: none; text-align: center; padding: 40px; font-weight: bold; color: var(--primary-color); }
    #step-quiz, #step-result { display: none; }
    .passage-box { background: #f1f5f9; padding: 15px; border-radius: 8px; font-size: 0.9rem; max-height: 150px; overflow-y: auto; margin-bottom: 15px; border-left: 4px solid var(--primary-color); }
    .status-text { font-size: 0.85rem; margin-top: 5px; color: #10b981; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎯 AI 고등 영어 내신 문제 생성기</h1>

    <!-- 0단계: API 키 설정 -->
    <div class="step-box" id="step-api">
      <h2>0단계: Gemini API 키 입력</h2>
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key를 입력하세요 (AIza...)">
      <button id="saveApiKeyBtn" class="btn secondary" style="padding: 8px;">API 키 저장하기</button>
      <p id="apiKeyStatus" class="status-text"></p>
    </div>

    <!-- 1단계: 지문 선택 및 입력 -->
    <div class="step-box" id="step-input">
      <h2>1단계: 영어 지문 선택 또는 입력</h2>
      
      <!-- 4등분 드롭다운 선택 목록 -->
      <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 5px;">프리셋 지문 고르기 (드롭다운)</label>
      <select id="presetPassageSelect">
        <option value="">-- 지문을 선택하세요 --</option>
        <option value="part1">[미래엔 파트 1]</option>
        <option value="part2">[미래엔 파트 2]</option>
        <option value="part3">[미래엔 파트 3]</option>
        <option value="part4">[미래엔 파트 4]</option>
      </select>

      <label style="font-size: 0.9rem; font-weight: bold; display: block; margin: 10px 0 5px 0;">지문 원문 내용</label>
      <textarea id="passageInput" placeholder="위에서 드롭다운을 선택하거나, 직접 영어 지문을 입력하세요..."></textarea>
      
      <!-- 4등분 숨겨진 원본 보관함 (따옴표 에러 완전 차단) -->
      <textarea id="hidden_part1" style="display:none;">[Welcome to the Dream Art Gallery! I’m
Isabel Williams, the docent for the
FromShadows to Spotlights exhibit. Today, you’regoing to meet three amazing artists who
never gave up on their art, despite challenges
in their lives. Each artist has a unique painting
style and story that has made their work
highly valued. Let’s explore each artist’s life and artwork
]</textarea>
      <textarea id="hidden_part2" style="display:none;">[The first artist we’re going to examine is Bill Traylor. Traylor was born into slavery
in the U.S. in 1853 and spent his early life working on a cotton farm in Alabama.
Although he became a free man after the American Civil War, he still had to face racial
discrimination, working for very low wages on the farm. Later, when he was around
70 years old, Traylor moved to the city of Montgomery, Alabama, where he found a
job in a factory. It wasn’t until he was 85 years old and became too ill to work that he
turned to drawing to express his life experiences. Now, we’re going to look at some of
his paintings, starting withMean Dog andMan and Large Dog. Traylor had a strong
fear of dogs because they had often been used on farms to watch and hunt slaves. His
fear of dogs is expressed strongly in these pieces. In contrast,Woman with Purse and
Man with Umbrella portrays the free lives of African Americans that he observed on
the streets of Montgomery. Using simple shapes and colors, Traylor captured complex
moments in American history from slavery to freedom. As a result, he’s now considered
an important figure in American folk art.
]</textarea>
      <textarea id="hidden_part3" style="display:none;">[Next, we have Maud Lewis, a renowned artist known for her heart-warming paintings.
Born in a small Canadian town in 1903, Lewis suffered from physical weaknesses such
as distorted shoulders and fingers. This limited her mobility and caused her to drop
out of school. To make a living, she began to paint and sell Christmas cards. When her
parents passed away, Lewis went to live with her aunt in Digby, Nova Scotia, where
she met her future husband, Everett Lewis. After marrying, the couple spent the rest of
their lives there, and Lewis continued to paint. She often depicted the Digby landscapesin paintings such as
Edge of Digby Harbor. Her artwork used a mixture of bright and vivid oil paints and simple forms, generating an original, innovative style.
Although her physical limitations confined her to a small cottage, her talent and imagination were
both limitless. In Red Sleigh, red maple leaves appear on a special winter landscape,
and Pair of Oxen shows decorated cows standing in a flower field. With these features,
Lewis’ paintings create a magical quality, like that of a fairy tale. As her paintings
gradually gained popularity, her story inspired many people and was later made into
books and movies. Maud Lewis expressed her love for the world through her paintings
and became an iconic figure in Canadian folk art.]</textarea>
      <textarea id="hidden_part4" style="display:none;">[Now, let's take a look at the final artist of this exhibition:Anna Ancher, a famous painter from Denmark. When observing her paintings, you may notice a common theme - they all feature female figures. Born in Skagen, Denmark, in 1859, she later moved to Copenhagen to attend a private painting school. After that, she even studied abroad in Paris,
which was unusual for women at the time. Thanks to her mother’s
encouragement, she was able to take advantage of these opportunities.
Even after getting married, Ancher persisted in painting, objecting
to the social pressure that married women were to solely focus on
household duties. Ancher differed from other artists of that era, who
depicted women as still life subjects. In contrast, she showcased them

a famous painter from Denmark. When observing her paintings, you
may notice a common theme — they all feature female figures.
Born inSkagen, Denmark, in 1859, she later move in her works The Maid in the Kitchen and
Sewing Fisherman’s Wife. 
She also skillfully exploredlight and color, contributing to the rich Impressionist movement in
Denmark. In her painting
the sunlight on the blue wall is stunningly portrayed.

exceptional artistic talent. Her paintings continue to amaze us to this day.
Thank you for joining this guided tour, and I hope my explanations
have aided you in appreciating these paintings. Please take some time to
further explore the exhibition.]</textarea>

      <label style="font-size: 0.9rem; font-weight: bold; display: block; margin: 10px 0 5px 0;">출제 유형 선택</label>
      <select id="quizTypeSelect">
        <option value="내신 변형 문제 (객관식 8문항 + 서술형 2문항)">고등 내신형 (객관식 + 서술형 10문제)</option>
        <option value="핵심 내용 이해 및 어법/어휘 집중 문제">어법/어휘 및 내용 이해 집중</option>
      </select>

      <button id="generateBtn" class="btn" style="margin-top: 15px;">🚀 AI 문제 10개 생성하기</button>
    </div>

    <!-- 로딩 화면 -->
    <div id="step-loading">
      <p>⏳ AI가 지문을 분석하여 고퀄리티 내신 문제를 출제하고 있습니다...</p>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 8px;">잠시만 기다려 주세요 (약 5~10초 소요)</p>
    </div>

    <!-- 2단계: 퀴즈 풀이 화면 -->
    <div class="step-box" id="step-quiz">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span id="quizProgress" style="font-weight: bold; color: var(--primary-color);">문제 1 / 10</span>
        <span id="scoreBadge" style="background: #e0e7ff; color: var(--primary-color); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem;">점수: 0점</span>
      </div>
      <div id="questionContainer"></div>
      <button id="nextBtn" class="btn" style="margin-top: 15px;">다음 문제 ➡️</button>
    </div>

    <!-- 3단계: 결과 화면 -->
    <div class="step-box" id="step-result">
      <h2>🎉 테스트 완료!</h2>
      <div id="scoreSummary" style="margin: 15px 0; font-size: 1.1rem; font-weight: bold;"></div>
      <div id="feedbackContainer" style="max-height: 350px; overflow-y: auto; margin-bottom: 15px;"></div>
      <button id="restartBtn" class="btn">🔄 처음으로 돌아가기</button>
    </div>

  </div>

  <!-- 자바스크립트 로직 -->
  <script type="module">
    import { GoogleGenAI } from "https://esm.run/@google/genai";

    document.addEventListener("DOMContentLoaded", () => {
      const apiKeyInput = document.getElementById("apiKeyInput");
      const saveApiKeyBtn = document.getElementById("saveApiKeyBtn");
      const apiKeyStatus = document.getElementById("apiKeyStatus");
      const presetPassageSelect = document.getElementById("presetPassageSelect");
      const passageInput = document.getElementById("passageInput");
      const quizTypeSelect = document.getElementById("quizTypeSelect");
      const generateBtn = document.getElementById("generateBtn");

      const stepApi = document.getElementById("step-api");
      const stepInput = document.getElementById("step-input");
      const stepLoading = document.getElementById("step-loading");
      const stepQuiz = document.getElementById("step-quiz");
      const stepResult = document.getElementById("step-result");

      const questionContainer = document.getElementById("questionContainer");
      const quizProgress = document.getElementById("quizProgress");
      const scoreBadge = document.getElementById("scoreBadge");
      const nextBtn = document.getElementById("nextBtn");
      const scoreSummary = document.getElementById("scoreSummary");
      const feedbackContainer = document.getElementById("feedbackContainer");
      const restartBtn = document.getElementById("restartBtn");

      // 드롭다운 선택 시 숨겨진 창에서 텍스트를 가져와서 입력창에 쏙 넣음
      presetPassageSelect.addEventListener("change", (e) => {
        const val = e.target.value;
        if (val) {
          const targetHidden = document.getElementById("hidden_" + val);
          if (targetHidden) {
            passageInput.value = targetHidden.value;
          }
        } else {
          passageInput.value = "";
        }
      });

      let currentApiKey = localStorage.getItem("gemini_api_key") || "";
      if (currentApiKey) {
        apiKeyInput.value = currentApiKey;
        apiKeyStatus.textContent = "저장된 API 키가 있습니다.";
      }

      saveApiKeyBtn.addEventListener("click", () => {
        const key = apiKeyInput.value.trim();
        if (!key) {
          alert("API 키를 입력해주세요.");
          return;
        }
        localStorage.setItem("gemini_api_key", key);
        currentApiKey = key;
        apiKeyStatus.textContent = "API 키가 정상 저장되었습니다!";
      });

      let quizData = [];
      let currentPassage = "";
      let currentIndex = 0;
      let userAnswers = [];
      let score = 0;

      generateBtn.addEventListener("click", async () => {
        const passage = passageInput.value.trim();
        const apiKey = currentApiKey || localStorage.getItem("gemini_api_key");

        if (!apiKey) {
          alert("⚠️ 0단계에서 Gemini API 키를 먼저 입력하고 [저장]을 눌러주세요!");
          return;
        }

        if (!passage) {
          alert("지문을 선택하거나 직접 입력해 주세요.");
          return;
        }
        currentPassage = passage;

        stepInput.style.display = "none";
        stepApi.style.display = "none";
        stepLoading.style.display = "block";

        try {
          quizData = await fetchQuizFromGemini(passage, quizTypeSelect.value, apiKey);
        } catch (err) {
          console.error("AI 문제 생성 에러:", err);
          alert("❌ AI 문제 생성 실패:\n" + err.message);
          stepLoading.style.display = "none";
          stepInput.style.display = "block";
          stepApi.style.display = "block";
          return;
        }

        stepLoading.style.display = "none";
        stepQuiz.style.display = "block";
        currentIndex = 0;
        userAnswers = new Array(quizData.length).fill(null);
        score = 0;
        renderQuestion();
      });

      async function fetchQuizFromGemini(passage, type, apiKey) {
        const ai = new GoogleGenAI({ apiKey: apiKey });
        
        const prompt = `다음 영어 지문을 바탕으로 고등학교 내신 대비 객관식 및 서술형 문제 총 10개를 순수 JSON 배열로만 생성해줘. (마크다운 백틱 등 금지, 오직 [ 로 시작해서 ] 로 끝나는 JSON 문자열만 출력할 것)
        출제 유형: ${type}
        지문 내용: ${passage}
        
        [출제 가이드라인]
        1. 구성: 
           - 글의 주제, 내용 일치/불일치, 세부 질문(Q&A) 등 내용 이해 문제 포함
           - 어법 및 어휘 문제 포함
           - 빈칸추론 출제 시, 반드시 question 문장 안에 명확한 빈칸 표시 "(        )"을 뚫어서 출제할 것.
           - 서술형 문제는 원문의 영어 문장을 직접 노출하지 말고 한국어 뜻과 조건(특정 단어 포함 영작)만 제시할 것.
        2. JSON 형식 규칙:
           - "type": "objective"(4지선다) 또는 "subjective"(서술형)
           - 객관식의 경우 "options" 배열(4개)과 "answer"(0~3 숫자 인덱스) 포함
           - 서술형의 경우 "options"는 [], "answerText"에 모범 답안 작성

        반드시 아래 형식의 JSON 배열만 반환하세요:
        [
          {
            "type": "objective",
            "question": "다음 글의 요지로 가장 적절한 것은?",
            "options": ["① option1", "② option2", "③ option3", "④ option4"],
            "answer": 0,
            "explanation": "해설 내용"
          },
          {
            "type": "subjective",
            "question": "[서술형 영작] 다음 한국어 뜻에 맞게 조건에 맞는 문장을 영어로 작성하시오.",
            "options": [],
            "answerText": "Sample answer sentence",
            "explanation": "모범 영작문 해설"
          }
        ]`;

        const response = await ai.models.generateContent({
          model: "gemini-3.8-flash",
          contents: prompt,
        });

        let text = response.text.trim();
        text = text.replace(/```json/g, "").replace(/```/g, "").trim();
        
        return JSON.parse(text);
      }

      function renderQuestion() {
        const q = quizData[currentIndex];
        quizProgress.textContent = `문제 ${currentIndex + 1} / ${quizData.length}`;
        scoreBadge.textContent = `점수: ${score}점`;

        let html = `
          <div class="passage-box">
            <strong>📖 사용 중인 지문 원문:</strong><br>${currentPassage}
          </div>
          <p style="margin-bottom: 15px; font-weight: bold; font-size: 1rem;">Q${currentIndex + 1}. ${q.question}</p>
        `;

        if (q.type === "objective") {
          q.options.forEach((opt, idx) => {
            const isChecked = userAnswers[currentIndex] === idx ? "checked" : "";
            html += `
              <label style="display: block; padding: 12px; margin-bottom: 8px; background: #f8fafc; border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); font-size: 0.95rem;">
                <input type="radio" name="quizOption" value="${idx}" ${isChecked} style="margin-right: 10px;">
                ${opt}
              </label>`;
          });
          html += `<button id="submitObjBtn" class="btn" style="margin-top: 15px;">정답 확인하기</button>`;
        } else {
          const savedText = typeof userAnswers[currentIndex] === 'string' ? userAnswers[currentIndex] : '';
          html += `
            <div>
              <p style="font-size: 0.9rem; color: #475569; font-weight: bold; margin-bottom: 8px;">✍️ 조건부 영작 답안 입력:</p>
              <input type="text" id="subjectiveInput" value="${savedText}" placeholder="여기에 영어 문장 답안을 입력하세요..." style="margin-bottom: 12px;">
              <button id="submitSubjBtn" class="btn">서술형 정답 확인하기</button>
            </div>
          `;
        }

        questionContainer.innerHTML = html;

        if (q.type === "objective") {
          document.getElementById("submitObjBtn").addEventListener("click", () => {
            const selected = document.querySelector('input[name="quizOption"]:checked');
            if (!selected) {
              alert("정답을 선택해주세요!");
              return;
            }
            const userChoice = parseInt(selected.value);
            userAnswers[currentIndex] = userChoice;

            if (userChoice === q.answer) {
              score += Math.round(100 / quizData.length);
              alert(`✅ 정답입니다!\n\n💡 해설: ${q.explanation}`);
            } else {
              alert(`❌ 틀렸습니다!\n\n정답: ${q.options[q.answer]}\n💡 해설: ${q.explanation}`);
            }
            scoreBadge.textContent = `점수: ${score}점`;
          });
        } else {
          document.getElementById("submitSubjBtn").addEventListener("click", () => {
            const textVal = document.getElementById("subjectiveInput").value.trim();
            if (!textVal) {
              alert("서술형 답안을 입력해 주세요!");
              return;
            }
            userAnswers[currentIndex] = textVal;
            score += Math.round(100 / quizData.length);
            alert(`📝 제출 완료!\n\n모범 정답: ${q.answerText}\n💡 해설: ${q.explanation}`);
            scoreBadge.textContent = `점수: ${score}점`;
          });
        }
      }

      nextBtn.addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < quizData.length) {
          renderQuestion();
        } else {
          showResult();
        }
      });

      function showResult() {
        stepQuiz.style.display = "none";
        stepResult.style.display = "block";
        scoreSummary.innerHTML = `<h3>총점: ${score}점 / 100점 만점</h3>`;

        let fbHtml = "<h4>🔍 전체 오답 노트 및 해설</h4><br>";
        quizData.forEach((q, idx) => {
          const userAns = userAnswers[idx];
          fbHtml += `
            <div style="margin-bottom: 15px; padding: 12px; background: #f8fafc; border-radius: 8px; border-left: 4px solid var(--primary-color);">
              <p><b>Q${idx+1}. ${q.question}</b></p>
              <p style="font-size: 0.9rem; margin-top: 4px;">내 답안: ${q.type === 'objective' ? (q.options[userAns] || '미선택') : (userAns || '미작성')}</p>
              <p style="font-size: 0.9rem; color: #10b981; margin-top: 2px;">정답: ${q.type === 'objective' ? q.options[q.answer] : q.answerText}</p>
              <p style="font-size: 0.85rem; color: #64748b; margin-top: 6px;">💡 해설: ${q.explanation}</p>
            </div>`;
        });
        feedbackContainer.innerHTML = fbHtml;
      }

      restartBtn.addEventListener("click", () => {
        stepResult.style.display = "none";
        stepInput.style.display = "block";
        stepApi.style.display = "block";
        presetPassageSelect.value = "";
        passageInput.value = "";
      });
    });
  </script>

</body>
</html>
