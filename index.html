<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등 영어 내신 서술형 & 내용이해 트레이너</title>
  <link rel="stylesheet" href="style.css">

  <!-- ES 모듈 맵 설정 -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 고등 영어 내신 서술형 & 내용이해 트레이너</h1>
      <p class="subtitle">모바일 최적화 · 미래엔 공통영어2 & 모의고사 자동 출제 · 서술형 대비</p>
    </header>

    <!-- 0단계: API 키 설정 -->
    <section class="card" id="step-api">
      <h2>0단계: Gemini API 키 설정</h2>
      <p class="desc">Google AI Studio API 키를 입력해주세요. (자동 저장됩니다)</p>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy... 로 시작하는 API 키 입력">
        <button id="saveApiKeyBtn" class="btn secondary">저장</button>
      </div>
      <div id="apiKeyStatus" class="status-msg"></div>
    </section>

    <!-- 1단계: 지문 키워드 선택 또는 입력 -->
    <section class="card" id="step-input">
      <h2>1단계: 시험 범위 지정</h2>
      <p class="desc">공부할 교과서 단원이나 모의고사 번호를 지정하세요.</p>
      
      <!-- 입력 방식 선택 라디오 버튼 -->
      <div class="input-mode-selector">
        <label>
          <input type="radio" name="inputMode" value="search" checked> 🔍 범위 검색 (미래엔 공통영어2 / 모의고사)
        </label>
        <label>
          <input type="radio" name="inputMode" value="direct"> ✍️ 지문 직접 복사·붙여넣기
        </label>
      </div>

      <!-- 모의고사/교과서 키워드 검색 방식 -->
      <div id="searchBoxGroup" class="mode-group">
        <div class="input-field-group">
          <label>시험 범위 입력 예시:</label>
          <input type="text" id="targetKeywordInput" placeholder="예: 미래엔 공통영어2 2과 / 고1 6월 모의고사 32번 / 미래엔 공통영어2 4과">
        </div>
      </div>

      <!-- 지문 직접 입력 방식 -->
      <div id="directBoxGroup" class="mode-group" style="display: none;">
        <div class="input-field-group">
          <label>영어 지문 원문 붙여넣기:</label>
          <textarea id="passageInput" placeholder="카페나 학습지 등에서 복사한 영어 지문을 여기에 붙여넣으세요..."></textarea>
        </div>
      </div>
      
      <div class="option-group">
        <label>문제 출제 유형:</label>
        <select id="quizTypeSelect">
          <option value="mixed">전체 혼합 (내용이해 + 어법/어휘 + 서술형 영작)</option>
          <option value="comprehension">내용 이해 & Q&A 질문 전용</option>
          <option value="subjective">서술형 / 조건부 영작 전용</option>
        </select>
      </div>

      <button id="generateBtn" class="btn primary">🚀 10문제 생성하기</button>
    </section>

    <!-- 로딩 화면 -->
    <section class="card loading-card" id="step-loading" style="display: none;">
      <div class="spinner"></div>
      <p id="loadingText">AI가 지정한 시험 범위의 지문을 분석하여 10문제를 생성 중입니다...</p>
    </section>

    <!-- 2단계: 퀴즈 풀이 영역 -->
    <section class="card" id="step-quiz" style="display: none;">
      <div class="quiz-header">
        <span id="quizProgress">문제 1 / 10</span>
        <span id="scoreBadge">점수: 0점</span>
      </div>
      
      <div id="questionContainer" class="question-box"></div>

      <div class="quiz-footer">
        <button id="nextBtn" class="btn primary">다음 문제</button>
      </div>
    </section>

    <!-- 3단계: 결과 및 피드백 영역 -->
    <section class="card" id="step-result" style="display: none;">
      <h2>🎉 학습 완료!</h2>
      <div id="scoreSummary" class="score-summary"></div>
      <div id="feedbackContainer" class="feedback-box"></div>
      <button id="restartBtn" class="btn primary">처음으로 돌아가기</button>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
