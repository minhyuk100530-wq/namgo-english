<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고등 영어 내신 서술형 영작 문제 관리 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter & Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header Header Header -->
  <header class="bg-indigo-600 text-white shadow-md mb-8">
    <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">🎯 고등 영어 서술형 문제 창고</h1>
        <p class="text-indigo-200 text-sm mt-1">내가 만든 문장으로 내신 서술형 Perfect 완벽 대비!</p>
      </div>
      <div class="flex gap-2">
        <button id="tabStudyBtn" class="px-4 py-2 bg-white text-indigo-700 font-semibold rounded-lg shadow hover:bg-indigo-50 transition text-sm">
          ✍️ 영작 연습하기
        </button>
        <button id="tabAddBtn" class="px-4 py-2 bg-indigo-700 text-white font-semibold rounded-lg hover:bg-indigo-800 transition text-sm border border-indigo-500">
          ➕ 새 문제 추가
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4">

    <!-- ==================== 1. 영작 연습 Section ==================== -->
    <section id="studySection" class="space-y-6">
      
      <!-- 상단 정보 및 필터 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-800">📚 등록된 서술형 문제 목록</h2>
          <p class="text-slate-500 text-xs mt-1">총 <span id="totalQuestionsCount" class="font-bold text-indigo-600">0</span>개의 문제가 창고에 보관되어 있습니다.</p>
        </div>
        <button id="resetStorageBtn" class="text-xs text-rose-500 hover:text-rose-700 underline font-medium">
          기본 문제로 초기화
        </button>
      </div>

      <!-- 문제 카드 목록 컨테이너 -->
      <div id="quizContainer" class="space-y-6">
        <!-- 자바스크립트로 동적 동적 카드가 생성됨 -->
      </div>
      
    </section>

    <!-- ==================== 2. 문제 추가 Section ==================== -->
    <section id="addSection" class="hidden">
      <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-xl font-bold text-slate-800 mb-2">➕ 새로운 서술형 문제 등록하기</h2>
        <p class="text-slate-500 text-sm mb-6">학교 선생님이 강조했거나 시험에 나올 만한 중요 문장을 직접 추가하세요. (자동으로 저장됩니다)</p>

        <form id="addQuestionForm" class="space-y-5">
          <!-- 한국어 뜻 입력 -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">🇰🇷 한국어 뜻 (지문/문제 조건)</label>
            <textarea id="inputKor" rows="2" required placeholder="예: 그가 85세가 되고 너무 아파서 일할 수 없게 된 것은 바로 그림을 그리며 자신의 인생 경험을 표현하게 되면서부터였다."
              class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm"></textarea>
          </div>

          <!-- 정답 영문장 입력 -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">🔤 정답 영어 문장</label>
            <textarea id="inputEng" rows="2" required placeholder="예: It wasn’t until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences."
              class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm font-mono"></textarea>
          </div>

          <!-- 핵심 문법 및 포인트 입력 -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">📌 핵심 문법 및 출제 포인트 (선택)</label>
            <input type="text" id="inputGrammar" placeholder="예: It ~ that 강조구문, not ~ until, too ~ to 용법 복합"
              class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
          </div>

          <!-- 등록 버튼 -->
          <div class="pt-2 flex gap-3">
            <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow transition">
              문제 창고에 저장하기 💾
            </button>
            <button type="button" id="cancelAddBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-5 rounded-lg transition">
              취소
            </button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <script>
    // ==========================================
    // 1. 초기 데이터 및 상태 세팅
    // ==========================================
    const DEFAULT_QUESTIONS = [
      {
        id: "default-1",
        kor: "그가 85세가 되고 너무 아파서 일할 수 없게 된 것은 바로 그림을 그리며 자신의 인생 경험을 표현하게 되면서부터였다.",
        eng: "It wasn’t until he was 85 years old and became too ill to work that he turned to drawing to express his life experiences.",
        grammar: "① It ~ that 강조구문  ② not ~ until 구문  ③ too ~ to 용법 (서술형 만점 방지용 3대 문법)"
      }
    ];

    let questions = [];

    // LocalStorage에서 데이터 가져오기
    function loadQuestions() {
      const saved = localStorage.getItem("my_english_quiz_warehouse");
      if (saved) {
        try {
          questions = JSON.parse(saved);
        } catch (e) {
          questions = [...DEFAULT_QUESTIONS];
        }
      } else {
        questions = [...DEFAULT_QUESTIONS];
      }
      saveQuestions();
    }

    // LocalStorage에 저장하기
    function saveQuestions() {
      localStorage.setItem("my_english_quiz_warehouse", JSON.stringify(questions));
      updateTotalCount();
    }

    function updateTotalCount() {
      const countEl = document.getElementById("totalQuestionsCount");
      if (countEl) countEl.textContent = questions.length;
    }

    // ==========================================
    // 2. 탭 전환 제어
    // ==========================================
    const tabStudyBtn = document.getElementById("tabStudyBtn");
    const tabAddBtn = document.getElementById("tabAddBtn");
    const studySection = document.getElementById("studySection");
    const addSection = document.getElementById("addSection");

    tabStudyBtn.addEventListener("click", () => {
      studySection.classList.remove("hidden");
      addSection.classList.add("hidden");
      tabStudyBtn.className = "px-4 py-2 bg-white text-indigo-700 font-semibold rounded-lg shadow hover:bg-indigo-50 transition text-sm";
      tabAddBtn.className = "px-4 py-2 bg-indigo-700 text-white font-semibold rounded-lg hover:bg-indigo-800 transition text-sm border border-indigo-500";
    });

    tabAddBtn.addEventListener("click", () => {
      studySection.classList.add("hidden");
      addSection.classList.remove("hidden");
      tabAddBtn.className = "px-4 py-2 bg-white text-indigo-700 font-semibold rounded-lg shadow hover:bg-indigo-50 transition text-sm";
      tabStudyBtn.className = "px-4 py-2 bg-indigo-700 text-white font-semibold rounded-lg hover:bg-indigo-800 transition text-sm border border-indigo-500";
    });

    document.getElementById("cancelAddBtn").addEventListener("click", () => {
      tabStudyBtn.click();
    });

    // ==========================================
    // 3. 문제 렌더링 및 채점 로직
    // ==========================================
    const quizContainer = document.getElementById("quizContainer");

    function renderQuestions() {
      quizContainer.innerHTML = "";

      if (questions.length === 0) {
        quizContainer.innerHTML = `
          <div class="bg-white p-8 rounded-xl border border-slate-200 text-center">
            <p class="text-slate-500 mb-4">등록된 문제가 없습니다. 새로운 문제를 추가해 보세요!</p>
            <button onclick="tabAddBtn.click()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm">문제 추가하러 가기</button>
          </div>`;
        return;
      }

      questions.forEach((q, idx) => {
        const card = document.createElement("div");
        card.className = "bg-white p-6 rounded-xl border border-slate-200 shadow-sm relative";
        
        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded">
              서술형 문제 ${idx + 1}
            </span>
            <button onclick="deleteQuestion('${q.id}')" class="text-slate-400 hover:text-rose-500 text-xs transition" title="삭제">
              🗑️ 삭제
            </button>
          </div>

          <div class="bg-indigo-50/70 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-4">
            <p class="text-slate-900 font-bold text-base leading-relaxed">🇰🇷 ${q.kor}</p>
          </div>

          ${q.grammar ? `<p class="text-xs text-slate-500 mb-3"><span class="font-semibold text-indigo-600">📌 문법 팁:</span> ${q.grammar}</p>` : ''}

          <!-- 유저 입력창 -->
          <div class="space-y-3">
            <textarea id="userAns_${q.id}" rows="2" placeholder="영어로 직접 문장을 입력해 보세요..."
              class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-sm font-mono"></textarea>

            <div class="flex gap-2">
              <button onclick="checkAnswer('${q.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition shadow">
                🎯 정답 확인 및 채점
              </button>
              <button onclick="toggleHint('${q.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-lg text-sm transition">
                👁️ 정답 보기
              </button>
            </div>
          </div>

          <!-- 채점 결과 및 정답 표시 영역 -->
          <div id="resultBox_${q.id}" class="mt-4 hidden p-4 rounded-lg text-sm space-y-2"></div>
        `;

        quizContainer.appendChild(card);
      });
    }

    // 텍스트 정규화 (대소문자 무시, 연속 공백 정리, 스마트 아포스트로피 통일)
    function normalizeText(str) {
      return str
        .toLowerCase()
        .replace(/[’']/g, "'") // 아포스트로피 통일
        .replace(/[^a-z0-9'\s]/g, "") // 기호 제거 (알파벳, 숫자, 아포스트로피만 유지)
        .replace(/\s+/g, " ")
        .trim();
    }

    // 채점 및 차이점 비교
    window.checkAnswer = function(qId) {
      const q = questions.find(item => item.id === qId);
      const userVal = document.getElementById(`userAns_${qId}`).value;
      const resultBox = document.getElementById(`resultBox_${qId}`);

      if (!userVal.trim()) {
        alert("문장을 입력한 후 정답 확인을 눌러주세요!");
        return;
      }

      const normalizedUser = normalizeText(userVal);
      const normalizedEng = normalizeText(q.eng);

      const isExactMatch = normalizedUser === normalizedEng;

      // 단어 단위 세부 비교
      const userWords = normalizedUser.split(" ");
      const targetWords = normalizedEng.split(" ");

      let diffHtml = '<div class="mt-2 font-mono text-xs flex flex-wrap gap-1">';
      userWords.forEach(word => {
        if (targetWords.includes(word)) {
          diffHtml += `<span class="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded border border-emerald-300">${word}</span>`;
        } else {
          diffHtml += `<span class="bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded border border-rose-300 line-through">${word}</span>`;
        }
      });
      diffHtml += '</div>';

      resultBox.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "bg-rose-50", "border-rose-200");

      if (isExactMatch) {
        resultBox.classList.add("bg-emerald-50", "border", "border-emerald-200", "text-emerald-900");
        resultBox.innerHTML = `
          <div class="font-bold text-emerald-700 text-base">🎉 정답입니다! (100% 일치)</div>
          <p class="text-xs text-emerald-800"><b>모범 답안:</b> ${q.eng}</p>
        `;
      } else {
        resultBox.classList.add("bg-rose-50", "border", "border-rose-200", "text-rose-900");
        resultBox.innerHTML = `
          <div class="font-bold text-rose-700 text-base">❌ 다시 한번 확인해 보세요!</div>
          <p class="text-xs text-slate-700 mt-1"><b>모범 답안:</b> <span class="font-mono text-indigo-700 font-semibold">${q.eng}</span></p>
          <div class="mt-2">
            <span class="text-xs text-slate-500 font-sans">작성한 문장 비교 분석 (초록: 일치 단어 / 빨강: 오답 단어):</span>
            ${diffHtml}
          </div>
        `;
      }
    };

    // 정답 보기 토글
    window.toggleHint = function(qId) {
      const q = questions.find(item => item.id === qId);
      const resultBox = document.getElementById(`resultBox_${qId}`);

      if (resultBox.classList.contains("hidden")) {
        resultBox.classList.remove("hidden");
        resultBox.className = "mt-4 p-4 rounded-lg text-sm bg-slate-100 border border-slate-200 text-slate-800 space-y-1";
        resultBox.innerHTML = `
          <p class="font-bold text-indigo-700">💡 모범 답안 정답:</p>
          <p class="font-mono text-slate-900 font-semibold">${q.eng}</p>
        `;
      } else {
        resultBox.classList.add("hidden");
      }
    };

    // 문제 삭제
    window.deleteQuestion = function(qId) {
      if (confirm("이 문제를 문제 창고에서 삭제하시겠습니까?")) {
        questions = questions.filter(q => q.id !== qId);
        saveQuestions();
        renderQuestions();
      }
    };

    // ==========================================
    // 4. 문제 추가 양식 제어
    // ==========================================
    const addQuestionForm = document.getElementById("addQuestionForm");

    addQuestionForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const kor = document.getElementById("inputKor").value.trim();
      const eng = document.getElementById("inputEng").value.trim();
      const grammar = document.getElementById("inputGrammar").value.trim();

      if (!kor || !eng) {
        alert("한국어 뜻과 영어 정답 문장은 필수 항목입니다!");
        return;
      }

      const newQ = {
        id: "q-" + Date.now(),
        kor: kor,
        eng: eng,
        grammar: grammar
      };

      questions.push(newQ);
      saveQuestions();

      // 양식 초기화
      addQuestionForm.reset();

      alert("🎉 새로운 서술형 문제가 창고에 성공적으로 저장되었습니다!");
      
      // 연습 탭으로 이동 및 렌더링
      renderQuestions();
      tabStudyBtn.click();
    });

    // 초기화 버튼
    document.getElementById("resetStorageBtn").addEventListener("click", () => {
      if (confirm("기본 예시 문제로 초기화하시겠습니까? (추가하신 내용이 지워질 수 있습니다)")) {
        questions = [...DEFAULT_QUESTIONS];
        saveQuestions();
        renderQuestions();
      }
    });

    // 앱 시작
    loadQuestions();
    renderQuestions();
  </script>
</body>
</html>
